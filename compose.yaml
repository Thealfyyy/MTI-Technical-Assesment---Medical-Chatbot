# Phase 1 Docker Compose Placeholder
# Defines the planned service boundary (API + llama.cpp model server) and persistent volume mounts.
# Full clean-machine verification is scheduled for Phase 7.

services:
  llm-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["phase7"]
    ports:
      - "8080:8080"
    volumes:
      - model_weights:/models
    environment:
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080

  api:
    build: .
    profiles: ["phase7"]
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - ./Docs/Data:/workspace/Docs/Data:ro
      - app_data:/workspace/data
      - model_weights:/workspace/.cache/models
    depends_on:
      - llm-server

volumes:
  model_weights:
  app_data:
