overlap_analysis:
  apparent_filename_conflict: >
    `pain headache ibs arthritis.docx` (KB-03) includes 'ibs arthritis' in its filename, which appears at first glance
    to overlap with `ادويه القولون و التهابات المفاصل.docx` (KB-09: Irritable bowel syndrome; arthritis).
  actual_document_structure_finding: >
    Full inspection of all 419 paragraphs of `pain headache ibs arthritis.docx` and all 509 paragraphs of
    `ادويه القولون و التهابات المفاصل.docx` proves that `pain headache ibs arthritis.docx` was misnamed when saved:
    its body contains ONLY Section 1 ('1. Pain & Fever – الألم والحرارة', paras 000..245) and Section 2
    ('2. Headache & Migraine – الصداع', paras 246..418), matching Appendix A KB-03 ('Pain and fever; headache and migraine')
    100%. Meanwhile, `ادويه القولون و التهابات المفاصل.docx` contains ONLY Section 1 ('1. أدوية القولون العصبي – IBS',
    paras 000..238) and Section 2 ('2. أدوية التهاب المفاصل – Arthritis', paras 239..508), matching Appendix A KB-09 100%.
  cross_document_pharmacological_overlap:
    - drug_class: "Systemic NSAIDs (Brufen/Ibuprofen, Nurofen, Profinal, Ibuflam, Cataflam/Diclofenac potassium, Voltaren/Diclofenac sodium, Olfen, Mobic/Meloxicam, Celebrex/Celecoxib, Arcoxia/Etoricoxib, Naprosyn/Naproxen, Xefo/Lornoxicam, Feldene/Piroxicam)"
      appearing_in:
        - "KB-03 (`pain headache ibs arthritis.docx` — Part 1: Pain & Fever -> 2. NSAIDs; Part 2: Headache & Migraine -> 2. NSAIDs)"
        - "KB-09 (`ادويه القولون و التهابات المفاصل.docx` — Part 2: Arthritis -> 1. NSAIDs)"
        - "KB-04 (`pharyngitis.docx` — 3. NSAIDs)"
      differences_noted: >
        Trade names, active ingredients, side effects, and contraindications for NSAIDs are nearly identical across
        KB-03 (Pain/Headache) and KB-09 (Arthritis), except KB-03 Headache & Migraine additionally lists `Flabu` (Ibuprofen)
        and `Spididol` (Ibuprofen arginine), and KB-03 Pain & Fever additionally lists `Declophen` (Diclofenac).
    - drug_class: "Simple Analgesics / Paracetamol (Panadol, Cetal, Adol, Paramol, Fevadol, Abimol)"
      appearing_in:
        - "KB-03 (`pain headache ibs arthritis.docx` — Part 1: 1. Paracetamol; Part 2: 1. Simple Analgesics)"
        - "KB-09 (`ادويه القولون و التهابات المفاصل.docx` — Part 2: Arthritis -> 6. Analgesics, alongside Tramadol/Tramal/Contramal/Zaldiar)"
        - "KB-04 (`pharyngitis.docx` — 1. Analgesics, 2. Antipyretics)"
        - "KB-06 (`ادويه الحساسيه و الجيوب الانفيه.docx` — Sinusitis -> 4. Analgesics)"
    - drug_class: "Antibiotics (Penicillins, Cephalosporins, Macrolides, Nitroimidazoles/Metronidazole)"
      appearing_in:
        - "KB-01 (COPD -> 10. Antibiotics), KB-02 (H. pylori -> 7. Antibiotics incl. Metronidazole/Flagyl/Amrizole), KB-04 (Pharyngitis -> 5. Antibiotics), KB-05 (Pneumonia -> 1..3), KB-06 (Sinusitis -> 6. Antibiotics)"
  handling_policy: >
    1. Keep the deterministic 1-to-1 file-to-KB-ID mapping above with zero splitting or merging of files.
    2. For shared drug classes (such as NSAIDs or Paracetamol appearing in KB-03, KB-09, KB-04, KB-06), both KB-03
       and KB-09 (and any other matching KB document) are legitimate, accurate sources when a query asks a general
       drug question (e.g., Dev Q1 'What is the active ingredient in Cataflam?' or Dev Q2 'ايه البدائل التجارية لـ Brufen؟').
    3. Retrieval and citation logic must preserve exact chunk provenance (`doc_id`, `title`, `section`, `snippet`)
       for every retrieved chunk used in the answer, and evaluation labels for general NSAID/Paracetamol questions
       must accept any retrieved starter KB ID (`KB-03`, `KB-09`, `KB-04`) that explicitly contains the cited fact.
